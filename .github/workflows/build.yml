name: Dross build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r server/requirements-study.txt requests
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.cjs
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: python tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dross-Deck-Translator
          path: out/Dross.Deck.Translator.zip
          retention-days: 30
